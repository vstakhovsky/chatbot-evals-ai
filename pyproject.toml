[project]
name = "chatbot-evals-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "pydantic",
    "python-dotenv",
    "tqdm",
    "dspy-ai",
    "jupyter",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    "integration: marks integration tests as skipped (deselect with '-m \"not integration\"')"
]

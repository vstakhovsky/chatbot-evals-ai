[project]
name = "chatbot-evals-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "numpy",
    "pandas",
    "pydantic>=2",
    "tqdm",
    "python-dotenv",
    "jupyter",
    "nbconvert",
]

[dependency-groups]
dev = [
    "ruff",
    "vulture",
    "radon",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "ARG"]
exclude = ["notebooks/", "data/"]
